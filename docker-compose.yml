version: '3.8'

services:
  # Aplicación web principal
  web:
    image: nginx:alpine
    container_name: portafolio-web
    ports:
      - "8088:80"
    volumes:
      - ./portafolio-web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app

  # Jenkins para CI/CD
  jenkins:
    image: jenkins/jenkins:lts-alpine
    container_name: jenkins-ci
    ports:
      - "8080:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portafolio-web:/workspace/app:ro
    environment:
      - JENKINS_OPTS=--httpPort=8080
      - JAVA_OPTS=-Xmx512m
    user: root
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - web

volumes:
  jenkins_data:

networks:
  app-network:
    driver: bridge
