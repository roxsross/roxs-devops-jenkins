# Tutorial Jenkins para Principiantes - Optimizado para Cloud Shell
cloudshell_tutorial:
  path: tutorial.md

# Archivos a mostrar al empezar
workspace:
  open_files:
    - "tutorial.md"
    - "README.md"
    - "instalar.sh"
    - "cloud-shell-helper.sh"
    - "diagnostico.sh"
    - "Jenkinsfile"

# Configuración inicial
cloudshell_open:
  - url: "https://shell.cloud.google.com/cloudshell/editor?terminal=true&cloudshell_tutorial=tutorial.md"