# Configuración de Nginx para Portfolio
# Este archivo debe copiarse a /etc/nginx/sites-available/portfolio

server {
    listen 80;
    server_name _;
    
    # Directorio raíz del portafolio
    root /var/www/portfolio;
    index gaming-hub.html index.html index.htm;
    
    # Logs específicos para el portafolio
    access_log /var/log/nginx/portfolio.access.log;
    error_log /var/log/nginx/portfolio.error.log;
    
    # Configuración principal para servir archivos estáticos
    location / {
        try_files $uri $uri/ =404;
        
        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        
        # Headers para mejor rendimiento
        add_header X-Served-By "Jenkins-Pipeline" always;
    }
    
    # Configuración de cache para archivos estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "HIT" always;
        
        # Logs específicos para assets
        access_log off;
    }
    
    # Página de información del build (creada por Jenkins)
    location /build-info {
        try_files /build-info.html =404;
        
        # No cachear esta página
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Endpoint de status para monitoring
    location /status {
        return 200 "Portfolio is running!\nDeployed via Jenkins Pipeline\nStatus: OK\n";
        add_header Content-Type text/plain;
        add_header X-Status "healthy" always;
    }
    
    # Endpoint de health check para Jenkins
    location /health {
        return 200 '{"status":"healthy","service":"portfolio","deployed_by":"jenkins"}';
        add_header Content-Type application/json;
    }
    
    # Bloquear acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Bloquear acceso a archivos de backup y temporales
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Configuración para archivos de log (si existen en el proyecto)
    location ~ \.(log|bak|backup|old)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Página de error personalizada
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /var/www/portfolio;
    }
    
    # Página de error 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /var/www/portfolio;
    }
    
    # Configuración para favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
    }
    
    # Configuración para robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
    
    # Configuración GZIP para mejor compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}
